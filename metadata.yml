Status: In progress
Title: Ersilia Reference Library Similarity
Description: Retrieves the most similar compounds to a query molecule from the 
  Ersilia Reference Library, a reference set of 1.36 million compounds 
  maintained by Ersilia. Similarity is computed with three complementary learned
  embeddings, namely CLAMP, SAND and Mol-JEPA, capturing bioactivity, 3D shape 
  and predicted biological context. The search is powered by LazySim, Ersilias 
  in-house package for fast similarity search in large chemical libraries, which
  indexes each embedding with turbovec 4-bit quantization.
